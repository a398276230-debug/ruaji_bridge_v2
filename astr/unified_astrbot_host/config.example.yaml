host:
  name: 统一 AstrBot 宿主
  data_dir: ./data
  shadow_mode: true

server:
  host: 127.0.0.1
  port: 8870
  max_connections: 32
  enrich_timeout_ms: 5000

identity:
  bot_name: BOT_NAME
  robot_id: '1111111111'
  owner_id: '1111111111'

persona:
  id: ruaji
  system_prompt: ''

providers:
  mode: ${HERMES_PROVIDER_MODE:-live}
  llm:
    base_url: ${LLM_BASE_URL:-http://127.0.0.1:8868/v1}
    model: ${LLM_MODEL:-gemini-3.7-flash-nv}
    api_key_env: LLM_API_KEY
    api_key: ${LLM_API_KEY:-""}
    timeout_s: 120
    max_retries: 2
  embedding:
    base_url: ${EMBEDDING_BASE_URL:-https://ir.youzi.today/v1/embeddings}
    model: ${EMBEDDING_MODEL:-Qwen3-Embedding-8B}
    api_key_env: EMBEDDING_API_KEY
    api_key: ${EMBEDDING_API_KEY:-""}
    dim: 1024
    timeout_s: 30
    max_retries: 3
  rerank:
    base_url: ${RERANK_BASE_URL:-https://ir.youzi.today/v1/rerank}
    model: ${RERANK_MODEL:-Qwen3-Reranker-8B}
    api_key_env: RERANK_API_KEY
    api_key: ${RERANK_API_KEY:-""}
    timeout_s: 20
    max_retries: 2

plugins:
  living_memory:
    package: astrbot_plugin_livingmemory
    path: ../astrbot_plugin_livingmemory
    enabled: true
    config:
      provider_settings:
        embedding_provider_id: ''
        llm_provider_id: ''
        rerank_provider_id: ''
      access_control:
        # 主人私聊专属桥接 Mem0（src/orchestration/mem0-ingestor.js），
        # LivingMemory 不捕获/不总结/不入图谱。留空时宿主自动注入
        # identity.owner_id；独立部署可写死或设 LIVINGMEMORY_OWNER_ID。
        owner_ids: ''
      graph_memory:
        enabled: true
      filtering_settings:
        memory_scope_mode: global
      agent_tools:
        enable_recall_tool: true
        enable_memorize_tool: true
  group_chat_plus:
    package: astrbot_plugin_group_chat_plus
    path: ../astrbot_plugin_group_chat_plus
    enabled: true
    config:
      enable_web_panel: false
      enable_group_chat: true
      decision_ai_provider_id: ''

# World Info 在 data_root/lorebooks.db 持久化，扫描/预算设置由面板「世界书」管理。
# 不再读取旧 community_memes 配置，不启动向量预热。旧库通过
# scripts/migrate-community-memes.py --source .../community_memes.db --data-root ... 显式迁移。
lorebook:
  # 是否在每轮请求的 system 提示尾部常驻世界书主动维护指令（默认 true）
  maintenanceHint: true
  # 自动维护新建条目（lorebook_add_entry 未传 book 时）的默认目标世界书（填书名或正整数 book id；留空时仅单书可省略 book，多书会报错并列出可选书名）
  defaultTargetBook: ''
  maintenancePrompt: '[世界书维护: 聊天中遇到不认识的梗、黑话、群内定型文或新冒出的梗时，先调用 search_lorebook_entries 查重；确认未收录且查证清楚含义后，再用 lorebook_add_entry 记入（key 填梗名与别名，content 写含义、来历与典型例句，group 归入合适分类）。已有条目过时或不准确时用 lorebook_update_entry 更新而勿重复新建，明显写错或重复的条目用 lorebook_delete_entry 删除；不确定含义时严禁凭猜测入库，切勿为了写而写，仅在确实遇到新内容时动手。]'

hermes:
  export_enabled: true
  export_dir: ${HERMES_AGENT_DIR:-F:/hermes-agent}
  tools_manifest: unified_host_tools.json
